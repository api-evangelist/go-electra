  uptime_target: null
  note: >-
    Electra markets "24/7 support" and network availability on
    https://www.go-electra.com/en/business/ but publishes no availability target
    and no service-level agreement, for either the charging network or the API.
status_page:
  url: null
  evidence: >-
    status.go-electra.com does not resolve (DNS failure, curl exit code 6 /
    HTTP 000 on 2026-08-17). No status, uptime or incident page is linked from
    the site footer, the help centre, or the business page. NO `StatusPage`
    pointer is emitted — this is a real miss, and for a company whose product is
    physical infrastructure a roaming partner has no machine-readable way to
    learn that a region is degraded.
