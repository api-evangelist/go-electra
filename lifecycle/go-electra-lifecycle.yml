source: >-
  https://ocpi.go-electra.com/ocpi/cpo/versions and version-detail endpoints
  (2026-08-17); site and help-centre search for a status page, SLA, versioning
  policy and deprecation policy.
description: >-
  Electra's API lifecycle posture is one strong signal surrounded by absences.
  The strong signal is genuine multi-version support with anonymous discovery.
  The absences are total: no status page, no SLA, no deprecation policy, no
  changelog, no release notes, no sunset headers.
versioning:
  scheme: ocpi-version-negotiation
  current: 2.2.1
  supported: ['2.1.1', '2.2.1']
  discovery: https://ocpi.go-electra.com/ocpi/cpo/versions
  path_form: /ocpi/cpo/{version}/{module}
  policy_url: null
  note: >-
    Running 2.1.1 and 2.2.1 concurrently, each with its own published endpoint
    inventory, is real backwards-compatibility work: a roaming partner still on
    2.1.1 is not broken by Electra's move to 2.2.1. Electra publishes no policy
    saying how long 2.1.1 will stay, which is the missing half.
  unsupported_version_behaviour: >-
    GET /ocpi/cpo/2.0.1 returns HTTP 404 rather than an OCPI 3002
    ("unsupported version") status_code in a JSON envelope.
deprecation:
  policy_url: null
  sunset_header: false
  deprecation_header: false
  evidence: >-
    No Deprecation or Sunset header on any of the six routes probed on
    2026-08-17; no deprecation, sunset or API-retirement policy anywhere on
