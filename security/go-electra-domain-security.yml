notes:
- >-
  www.go-electra.com is a CloudFront + S3 static site (server: CloudFront on the
  301, AmazonS3 on the 200) and serves no HSTS header, so the marketing host is
  the weaker of the two. The API host ocpi.go-electra.com is behind Cloudflare
  in front of a Rails application and does send HSTS.
- >-
  ocpi.go-electra.com also returns a restrictive Content-Security-Policy
  (default-src 'self') on JSON API responses, and the standard Rails hardening
  set (X-Frame-Options SAMEORIGIN, X-Content-Type-Options nosniff,
  Referrer-Policy strict-origin-when-cross-origin,
  X-Permitted-Cross-Domain-Policies none).
- >-
  The observed CSP connect-src on ocpi.go-electra.com includes
  http://localhost:3004 and http://localhost:3035 — development origins left in
  a production policy header. Recorded as observed; it is a hygiene note, not a
  vulnerability finding.
