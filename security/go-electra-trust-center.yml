gaps:
- >-
  No vulnerability disclosure or responsible-disclosure policy is published.
  /.well-known/security.txt returned 404 on go-electra.com,
  backend.go-electra.com and ocpi.go-electra.com. The only reporting channel
  Electra publishes is its ethics/whistleblowing page
  (https://www.go-electra.com/en/whistleblowing-and-grievance/, ethics@go-electra.com,
  anonymous Google Forms, postal mail to VP Legal), which is explicitly scoped to
  the Code of Conduct, corruption and harassment — it names no security contact
  and no bug bounty. Consequently no `Security` /
  `VulnerabilityDisclosure` artifact or pointer is emitted, and the
  security_disclosure check is a genuine miss rather than an unrecorded one.
- >-
  A security researcher who found a flaw in the OCPI surface has no published
  address to send it to. Adding a security.txt on go-electra.com and
  ocpi.go-electra.com, and surfacing the disclosure policy that almost certainly
  already exists inside the Vanta trust centre, is the single cheapest fix on
  this profile.
