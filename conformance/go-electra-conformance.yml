- id: mcp
  conforms: false
  evidence: No MCP server is published or discoverable. See mcp/go-electra-mcp.yml.
- id: llmstxt
  conforms: false
  evidence: >-
    /llms.txt returned 404 on go-electra.com and the SPA shell on
    app.go-electra.com and stations.go-electra.com. A generated one is provided
    at llms/go-electra-llms.txt and is ours, not Electra's.
- id: idempotency
  conforms: unknown
  evidence: >-
    No idempotency contract is documented, and the write-bearing OCPI modules
    (commands POST, tokens PUT) are token-gated so no header behaviour could be
    observed. OCPI itself defines PUT semantics on tokens but no
    idempotency-key header. Nothing is asserted.
- id: pagination
  conforms: unknown
  evidence: >-
    OCPI defines offset/limit pagination with Link and X-Total-Count headers on
    its SENDER modules, but Electra's locations/sessions/cdrs/tariffs endpoints
    are gated so no pagination behaviour could be observed anonymously.
- id: rate-limit-headers
  conforms: false
  evidence: >-
    No X-RateLimit-*, RateLimit-* or Retry-After header appeared on any probed
    response, including the anonymous 200s from /ocpi/cpo/versions. No limits
    are documented.
- id: iso-8601-datetime
  conforms: true
  evidence: >-
    The OCPI envelope timestamp is ISO 8601 UTC — `"timestamp":
    "2026-08-17T13:45:30Z"` on both version-detail responses.
- id: iso-4217-currency
  conforms: unknown
  evidence: >-
    Consumer pricing is published in EUR and CHF, but the OCPI tariffs module is
    gated so the machine-readable currency field could not be observed.
- id: tls-1.3
  conforms: true
  evidence: security/go-electra-domain-security.yml
- id: hsts
  conforms: true
  evidence: >-
    `strict-transport-security: max-age=63072000; includeSubDomains` observed on
