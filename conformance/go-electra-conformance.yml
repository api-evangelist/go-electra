- id: content-security-policy
  conforms: true
  evidence: >-
    ocpi.go-electra.com returns a real restrictive CSP (default-src 'self') on
    API responses, which is unusual for a JSON API and indicates a shared Rails
    application layer.
- id: iso-15118-plug-and-charge
  conforms: partial
  evidence: >-
    Electra's help centre publishes a dedicated Plug&Charge collection (4
    articles) alongside Autocharge (7 articles), so Plug&Charge is a live
    product feature. No ISO 15118 version, certificate-handling detail or
    conformance statement is published, so only the product claim is recorded.
- id: ocpp
  conforms: unknown
  evidence: >-
    Electra builds and operates its own hardware, which implies a charge-point
    protocol, but no OCPP version or profile is published anywhere on its public
    surface. Nothing is asserted.
- id: eu-afir
  conforms: unknown
  evidence: >-
    AFIR (EU 2023/1804) obliges operators of publicly accessible recharging
    points to make static and dynamic data available, typically through a
    national access point. Electra publishes no statement about AFIR data
    provision and no open data feed of its own; whether it files to national
    access points could not be established from its public surface.
certifications_published: false
certifications_note: >-
  Electra runs a real trust centre at https://trust.go-electra.com/ (HTTP 200,
  linked from the site footer as "Security", hosted on Vanta — the page's own
  markup carries data-slugid 29bokoh51ag58ypkefl6z3 and og:image on
  app.eu.vanta.com). Its contents render client-side from a signed Vanta bundle,
  so no certification name (ISO 27001, SOC 2, PCI DSS, GDPR) could be read
  anonymously, and none is asserted here. Because no certification is readable,
  no `Compliance` pointer is emitted in apis.yml — the trust centre presence is
  recorded as TrustCenter only.
