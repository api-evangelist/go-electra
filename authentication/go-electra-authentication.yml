absent:
- scheme: oauth2
  evidence: >-
    /.well-known/oauth-authorization-server and
    /.well-known/oauth-protected-resource returned 404 on go-electra.com,
    backend.go-electra.com and ocpi.go-electra.com, and an HTML SPA shell (not a
